<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plateforme de gestion ICC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <div id="app"></div>
    <script>
        const SUPABASE_URL = 'https://kmoqkcpndqegsiioezgj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-fZwKreNBuJjf03tkJfjRg_IsepO0gp';
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, activeTab = 'dashboard', sidebarOpen = false, expandedDepts = {}, expandedSundays = {}, expandedBirthdayMonths = {}, selectedMonth = 7, selectedYear = 2026;
        let departments = [], events = [], availability = {}, maintenanceSchedule = {}, adminPassword = 'admin123';
        const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

        async function loadData() {
            try {
                const [d, e, a] = await Promise.all([supabase.from('departments').select('*'), supabase.from('events').select('*'), supabase.from('availability').select('*')]);
                if (d.data) departments = d.data;
                if (e.data) events = e.data;
                if (a.data) { availability = {}; a.data.forEach(item => { availability[item.key] = item.available; }); }
                generateMaintenanceSchedule();
                setupRealtimeListeners();
                render();
            } catch (e) { loadLocalData(); render(); }
        }

        function loadLocalData() {
            const d = localStorage.getItem('departments'), e = localStorage.getItem('events'), a = localStorage.getItem('availability');
            if (d) departments = JSON.parse(d);
            if (e) events = JSON.parse(e);
            if (a) availability = JSON.parse(a);
            generateMaintenanceSchedule();
        }

        function setupRealtimeListeners() {
            supabase.channel('depts').on('postgres_changes', { event: '*', schema: 'public', table: 'departments' }, () => loadDepartments()).subscribe();
            supabase.channel('events').on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => loadEvents()).subscribe();
            supabase.channel('avail').on('postgres_changes', { event: '*', schema: 'public', table: 'availability' }, () => loadAvailability()).subscribe();
        }

        async function loadDepartments() { const { data } = await supabase.from('departments').select('*'); if (data) { departments = data; generateMaintenanceSchedule(); render(); } }
        async function loadEvents() { const { data } = await supabase.from('events').select('*'); if (data) { events = data; render(); } }
        async function loadAvailability() { const { data } = await supabase.from('availability').select('*'); if (data) { availability = {}; data.forEach(item => { availability[item.key] = item.available; }); render(); } }

        function generateMaintenanceSchedule() {
            maintenanceSchedule = {};
            if (departments.length === 0) return;
            let deptIndex = 0, deptsList = departments.slice();
            for (let year = 2026; year <= 2026; year++) {
                for (let month = 8; month <= 12; month++) {
                    const sundays = getSundays(month, year), key = `${year}-${String(month).padStart(2, '0')}`;
                    maintenanceSchedule[key] = [];
                    sundays.forEach((sunday, index) => {
                        maintenanceSchedule[key].push({ sunday: sunday, week: index + 1, dept: deptsList[(deptIndex + index) % deptsList.length] });
                    });
                    deptIndex = (deptIndex + sundays.length) % deptsList.length;
                }
            }
        }

        function getAllStars() {
            const allStars = {};
            departments.forEach(dept => { if (dept.stars) { dept.stars.forEach(star => { if (!allStars[star.id]) allStars[star.id] = star; }); } });
            return Object.values(allStars);
        }

        function getBirthdaysFromStars() {
            const birthdays = [], stars = getAllStars();
            stars.forEach(star => { if (star.birthDate && !birthdays.some(b => b.id === star.id)) { birthdays.push({id: star.id, name: star.name, date: star.birthDate}); } });
            return birthdays.sort((a, b) => { const dateA = new Date(a.date), dateB = new Date(b.date); return dateA.getMonth() - dateB.getMonth() || dateA.getDate() - dateB.getDate(); });
        }

        function getBirthdaysByMonth() {
            const birthdays = getBirthdaysFromStars(), grouped = {};
            birthdays.forEach(b => { const month = new Date(b.date).getMonth(); if (!grouped[month]) grouped[month] = []; grouped[month].push(b); });
            return grouped;
        }

        function getSundays(month, year) {
            const sundays = [], date = new Date(year, month - 1, 1);
            while (date.getDay() !== 0) date.setDate(date.getDate() + 1);
            while (date.getMonth() === month - 1) { sundays.push(new Date(date)); date.setDate(date.getDate() + 7); }
            return sundays;
        }

        function formatDate(date) { return date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
        function render() { if (!currentUser) renderLogin(); else renderDashboard(); }

        function renderLogin() {
            document.getElementById('app').innerHTML = `<div class="min-h-screen bg-gradient-to-br from-red-50 to-red-100 flex items-center justify-center p-4"><div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8 space-y-8"><div class="text-center space-y-2"><div class="w-12 h-12 bg-red-600 rounded-lg mx-auto flex items-center justify-center"><span class="text-white text-lg font-bold">P</span></div><h1 class="text-3xl font-bold text-black">Plateforme de gestion</h1><p class="text-sm text-gray-600">ICC Lyon Sud</p></div><div class="space-y-4"><input id="email" type="email" placeholder="Email" value="admin@icc.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-black text-sm" /><input id="password" type="password" placeholder="Mot de passe" value="admin123" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-black text-sm" /></div><button onclick="handleLogin()" class="w-full px-4 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg">Connexion</button><div class="text-center"><p class="text-xs text-gray-600">admin@icc.com / admin123</p></div></div></div>`;
        }

        function handleLogin() {
            const email = document.getElementById('email').value, password = document.getElementById('password').value;
            if (email === 'admin@icc.com' && password === adminPassword) { currentUser = {name: 'Admin', email: email}; activeTab = 'dashboard'; render(); }
            else alert('Identifiants incorrects!');
        }

        function handleLogout() { currentUser = null; activeTab = 'dashboard'; render(); }
        function changePassword() {
            const oldPassword = prompt('Ancien mot de passe:');
            if (!oldPassword || oldPassword !== adminPassword) { alert('Incorrect!'); return; }
            const newPassword = prompt('Nouveau mot de passe:');
            if (newPassword && newPassword.length >= 3) { adminPassword = newPassword; alert('Changé!'); }
        }

        function switchTab(tab) { activeTab = tab; sidebarOpen = false; render(); }

        function renderDashboard() {
            const sundays = getSundays(selectedMonth, selectedYear), allStars = getAllStars();
            let content = '';

            if (activeTab === 'dashboard') {
                const nextSunday = sundays[0], totalServ = nextSunday ? Object.values(getServicesForSunday(nextSunday)).reduce((acc, d) => acc + d.stars.length, 0) : 0;
                content = `<div class="space-y-12"><h1 class="text-4xl font-bold">Bienvenue</h1><div class="grid grid-cols-1 md:grid-cols-4 gap-6"><div class="bg-red-600 text-white p-6 rounded-lg"><p>Stars ★</p><p class="text-4xl font-bold">${allStars.length}</p></div><div class="bg-red-500 text-white p-6 rounded-lg"><p>Départements</p><p class="text-4xl font-bold">${departments.length}</p></div><div class="bg-red-400 text-white p-6 rounded-lg"><p>Prochaines stars ★</p><p class="text-4xl font-bold">${totalServ}</p></div><div class="bg-red-700 text-white p-6 rounded-lg"><p>Événements</p><p class="text-4xl font-bold">${events.length}</p></div></div></div>`;
            }
            else if (activeTab === 'recap') {
                content = `<div><h1 class="text-4xl font-bold mb-6">Services dimanche</h1><div class="flex gap-4 mb-6"><button onclick="setPrevMonth()" class="px-4 py-2 bg-gray-200 rounded">←</button><span>${monthNames[selectedMonth - 1]} ${selectedYear}</span><button onclick="setNextMonth()" class="px-4 py-2 bg-gray-200 rounded">→</button></div>${sundays.map(sunday => {
                    const dateStr = sunday.toISOString().split('T')[0], isExpanded = expandedSundays[dateStr], services = getServicesForSunday(sunday), totalServers = Object.values(services).reduce((acc, d) => acc + d.stars.length, 0), deptsCovered = Object.values(services).filter(d => d.stars.length > 0).length;
                    return `<div class="bg-white rounded-lg shadow mb-4"><button onclick="toggleSundayExpand('${dateStr}')" class="w-full p-4 flex justify-between"><div><h2 class="font-bold">${formatDate(sunday)}</h2><p class="text-sm text-gray-600">${totalServers} stars • ${deptsCovered}/${departments.length}</p></div><span>${isExpanded ? '▲' : '▼'}</span></button></div>`;
                }).join('')}</div>`;
            }
            else if (activeTab === 'planning') {
                content = `<div><h1 class="text-4xl font-bold mb-6">Planning</h1><div class="flex gap-4 mb-6"><button onclick="setPrevMonth()" class="px-4 py-2 bg-gray-200 rounded">←</button><span>${monthNames[selectedMonth - 1]}</span><button onclick="setNextMonth()" class="px-4 py-2 bg-gray-200 rounded">→</button></div>${departments.map(dept => {
                    const isExpanded = expandedDepts[dept.id];
                    return `<div class="bg-white rounded-lg shadow mb-4"><button onclick="toggleDeptExpand('${dept.id}')" class="w-full p-4 flex justify-between"><div><h2 class="font-bold">${dept.name}</h2><p>${dept.stars ? dept.stars.length : 0} stars</p></div><span>${isExpanded ? '▲' : '▼'}</span></button></div>`;
                }).join('')}</div>`;
            }
            else if (activeTab === 'departments') {
                content = `<div><div class="flex justify-between mb-6"><h1 class="text-4xl font-bold">Départements</h1><button onclick="addDepartment()" class="px-6 py-3 bg-red-600 text-white rounded">+ Ajouter</button></div>${departments.map(dept => {
                    return `<div class="bg-white rounded-lg shadow p-6 mb-4"><div class="flex justify-between"><h2 class="text-xl font-bold">${dept.name}</h2><button onclick="deleteDepartment('${dept.id}')" class="text-red-600">✕</button></div><p class="text-3xl font-bold text-red-600 mt-4">${dept.stars ? dept.stars.length : 0}</p><button onclick="addStarToDept('${dept.id}')" class="w-full mt-4 py-2 border-2 border-dashed border-red-300 text-red-600 rounded">+ Star</button></div>`;
                }).join('')}</div>`;
            }
            else if (activeTab === 'birthdays') {
                const birthdaysByMonth = getBirthdaysByMonth();
                content = `<div><h1 class="text-4xl font-bold mb-6">Anniversaires</h1>${Object.entries(birthdaysByMonth).map(([monthIndex, birthdays]) => {
                    const isExpanded = expandedBirthdayMonths[monthIndex];
                    return `<div class="bg-white rounded-lg shadow mb-4"><button onclick="toggleBirthdayMonth(${monthIndex})" class="w-full p-4 flex justify-between"><div><h2 class="font-bold">${monthNames[monthIndex]}</h2><p>${birthdays.length} anniversaire(s)</p></div><span>${isExpanded ? '▲' : '▼'}</span></button></div>`;
                }).join('')}</div>`;
            }
            else if (activeTab === 'maintenance') {
                content = `<div><h1 class="text-4xl font-bold mb-6">Entretien</h1>${Object.entries(maintenanceSchedule).map(([key, schedule]) => {
                    const [year, month] = key.split('-'), monthIndex = parseInt(month) - 1;
                    return `<div class="bg-white rounded-lg shadow p-6 mb-6"><h2 class="text-2xl font-bold mb-4">${monthNames[monthIndex]} ${year}</h2><div class="space-y-4">${schedule.map(item => `<div class="flex gap-4"><div class="w-16 h-16 bg-red-100 rounded flex flex-col items-center justify-center"><span class="font-bold text-red-600">${item.sunday.getDate()}</span></div><div><p class="text-gray-600">${formatDate(item.sunday)}</p><p class="font-bold">${item.dept.name}</p></div></div>`).join('')}</div></div>`;
                }).join('')}</div>`;
            }
            else if (activeTab === 'events') {
                content = `<div><div class="flex justify-between mb-6"><h1 class="text-4xl font-bold">Événements</h1><button onclick="addEvent()" class="px-6 py-3 bg-red-600 text-white rounded">+ Ajouter</button></div>${events.map(e => `<div class="bg-white rounded-lg shadow p-6 mb-4 border-l-4 border-red-600"><div class="flex justify-between"><div><h3 class="font-bold">${e.title}</h3><p class="text-gray-600">${new Date(e.date).toLocaleDateString('fr-FR')}</p></div><button onclick="deleteEvent(${e.id})" class="text-red-600">✕</button></div></div>`).join('')}</div>`;
            }

            document.getElementById('app').innerHTML = `<div class="min-h-screen bg-gray-50 flex"><div class="${sidebarOpen ? '' : 'hidden'} md:block w-64 h-screen bg-white border-r p-6 fixed md:relative z-40"><h2 class="text-xl font-bold">Plateforme</h2><p class="text-gray-600 mt-1">${currentUser.name}</p><nav class="space-y-2 mt-8">${['dashboard','recap','planning','departments','birthdays','maintenance','events'].map(tab => `<button onclick="switchTab('${tab}')" class="w-full text-left px-4 py-2 rounded ${activeTab === tab ? 'bg-red-600 text-white' : 'hover:bg-gray-100'}">${{dashboard:'Tableau de bord',recap:'Récapitulatif',planning:'Planning',departments:'Départements',birthdays:'Anniversaires',maintenance:'Entretien',events:'Événements'}[tab]}</button>`).join('')}</nav><button onclick="handleLogout()" class="mt-8 w-full px-4 py-2 border rounded hover:bg-gray-50">Déconnexion</button></div><div class="flex-1 overflow-auto"><div class="md:hidden bg-white border-b p-4 flex justify-between"><h2 class="font-bold">Plateforme</h2><button onclick="toggleSidebar()" class="text-red-600">☰</button></div><div class="p-6">${content}</div></div></div>`;
        }

        function toggleSidebar() { sidebarOpen = !sidebarOpen; render(); }
        function toggleDeptExpand(deptId) { expandedDepts[deptId] = !expandedDepts[deptId]; render(); }
        function toggleSundayExpand(dateStr) { expandedSundays[dateStr] = !expandedSundays[dateStr]; render(); }
        function toggleBirthdayMonth(monthIndex) { expandedBirthdayMonths[monthIndex] = !expandedBirthdayMonths[monthIndex]; render(); }
        function setPrevMonth() { selectedMonth = selectedMonth === 1 ? 12 : selectedMonth - 1; if (selectedMonth === 12) selectedYear--; render(); }
        function setNextMonth() { selectedMonth = selectedMonth === 12 ? 1 : selectedMonth + 1; if (selectedMonth === 1) selectedYear++; render(); }

        async function toggleAvailability(deptId, starId, dateStr) { const key = `${deptId}_${starId}_${dateStr}`; const newValue = !availability[key]; availability[key] = newValue; try { await supabase.from('availability').upsert({ key: key, available: newValue }, { onConflict: 'key' }); } catch (e) {} render(); }
        async function addDepartment() { const name = prompt('Nom du département:'); if (!name) return; const newDept = { id: name.toLowerCase().replace(/\s+/g, '_'), name: name, stars: [] }; departments.push(newDept); try { await supabase.from('departments').insert(newDept); } catch (e) {} loadDepartments(); }
        async function deleteDepartment(deptId) { if (confirm('Êtes-vous sûr?')) { departments = departments.filter(d => d.id !== deptId); try { await supabase.from('departments').delete().eq('id', deptId); } catch (e) {} loadDepartments(); } }
        async function addStarToDept(deptId) { const name = prompt('Nom:'); if (!name) return; const email = prompt('Email:'); const phone = prompt('Téléphone:'); const birthDate = prompt('Date naissance (YYYY-MM-DD):'); const dept = departments.find(d => d.id === deptId); if (dept) { const newStar = { id: Date.now(), name: name, email: email || '', phone: phone || '', birthDate: birthDate || '' }; dept.stars.push(newStar); try { await supabase.from('departments').update({ stars: dept.stars }).eq('id', deptId); } catch (e) {} loadDepartments(); } }
        async function removeStarFromDept(deptId, starId) { if (confirm('Sûr?')) { const dept = departments.find(d => d.id === deptId); if (dept) { dept.stars = dept.stars.filter(s => s.id !== starId); try { await supabase.from('departments').update({ stars: dept.stars }).eq('id', deptId); } catch (e) {} loadDepartments(); } } }
        async function addEvent() { const title = prompt('Titre:'); if (!title) return; const date = prompt('Date (YYYY-MM-DD):'); const startTime = prompt('Heure:'); const location = prompt('Lieu:'); const newEvent = { id: Date.now(), title: title, date: date || '', startTime: startTime || '', location: location || '' }; events.push(newEvent); try { await supabase.from('events').insert(newEvent); } catch (e) {} loadEvents(); }
        async function deleteEvent(id) { if (confirm('Sûr?')) { events = events.filter(e => e.id !== id); try { await supabase.from('events').delete().eq('id', id); } catch (e) {} loadEvents(); } }

        function getServicesForSunday(sunday) { const dateStr = sunday.toISOString().split('T')[0], result = {}; departments.forEach(dept => { result[dept.id] = { name: dept.name, stars: (dept.stars || []).filter(star => availability[`${dept.id}_${star.id}_${dateStr}`] || false) }; }); return result; }

        loadData();
    </script>
</body>
</html>
