<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plateforme de gestion ICC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <div id="app"></div>
    <script>
        const SUPABASE_URL = 'https://kmoqkcpndqegsiioezgj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-fZwKreNBuJjf03tkJfjRg_IsepO0gp';
        
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let activeTab = 'dashboard';
        let sidebarOpen = false;
        let expandedDepts = {};
        let expandedSundays = {};
        let expandedBirthdayMonths = {};
        let selectedMonth = 7;
        let selectedYear = 2026;

        let departments = [];
        let events = [];
        let availability = {};
        let maintenanceSchedule = {};
        let adminPassword = 'admin123';

        const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

        async function initializeData() {
            try {
                const { data: deptsData } = await supabase.from('departments').select('*');
                const { data: eventsData } = await supabase.from('events').select('*');
                const { data: availData } = await supabase.from('availability').select('*');
                
                if (deptsData) departments = deptsData;
                if (eventsData) events = eventsData;
                if (availData) {
                    availability = {};
                    availData.forEach(item => {
                        availability[item.key] = item.available;
                    });
                }
                
                generateMaintenanceSchedule();
                setupRealtimeListeners();
                render();
            } catch (e) {
                loadLocalData();
                render();
            }
        }

        function loadLocalData() {
            const savedDepts = localStorage.getItem('departments');
            const savedEvents = localStorage.getItem('events');
            const savedAvailability = localStorage.getItem('availability');
            
            if (savedDepts) departments = JSON.parse(savedDepts);
            if (savedEvents) events = JSON.parse(savedEvents);
            if (savedAvailability) availability = JSON.parse(savedAvailability);
            
            generateMaintenanceSchedule();
        }

        function setupRealtimeListeners() {
            supabase.channel('departments_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'departments' }, () => loadDepartments()).subscribe();
            supabase.channel('events_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => loadEvents()).subscribe();
            supabase.channel('availability_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'availability' }, () => loadAvailability()).subscribe();
        }

        async function loadDepartments() {
            const { data } = await supabase.from('departments').select('*');
            if (data) {
                departments = data;
                localStorage.setItem('departments', JSON.stringify(departments));
                generateMaintenanceSchedule();
                render();
            }
        }

        async function loadEvents() {
            const { data } = await supabase.from('events').select('*');
            if (data) {
                events = data;
                localStorage.setItem('events', JSON.stringify(events));
                render();
            }
        }

        async function loadAvailability() {
            const { data } = await supabase.from('availability').select('*');
            if (data) {
                availability = {};
                data.forEach(item => {
                    availability[item.key] = item.available;
                });
                localStorage.setItem('availability', JSON.stringify(availability));
                render();
            }
        }

        function generateMaintenanceSchedule() {
            maintenanceSchedule = {};
            if (departments.length === 0) return;

            const startMonth = 8;
            const startYear = 2026;
            const endMonth = 12;
            const endYear = 2026;

            let deptIndex = 0;
            const deptsList = departments.slice();

            for (let year = startYear; year <= endYear; year++) {
                const startM = year === startYear ? startMonth : 8;
                const endM = year === endYear ? endMonth : 12;

                for (let month = startM; month <= endM; month++) {
                    const sundays = getSundays(month, year);
                    const key = `${year}-${String(month).padStart(2, '0')}`;
                    maintenanceSchedule[key] = [];

                    sundays.forEach((sunday, index) => {
                        if (index < deptsList.length) {
                            maintenanceSchedule[key].push({
                                sunday: sunday,
                                week: index + 1,
                                dept: deptsList[(deptIndex + index) % deptsList.length]
                            });
                        }
                    });

                    deptIndex = (deptIndex + sundays.length) % deptsList.length;
                }
            }
        }

        function getAllStars() {
            const allStars = {};
            departments.forEach(dept => {
                if (dept.stars) {
                    dept.stars.forEach(star => {
                        if (!allStars[star.id]) {
                            allStars[star.id] = star;
                        }
                    });
                }
            });
            return Object.values(allStars);
        }

        function getBirthdaysFromStars() {
            const birthdays = [];
            const stars = getAllStars();
            stars.forEach(star => {
                if (star.birthDate && !birthdays.some(b => b.id === star.id)) {
                    birthdays.push({id: star.id, name: star.name, date: star.birthDate});
                }
            });
            return birthdays.sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                return dateA.getMonth() - dateB.getMonth() || dateA.getDate() - dateB.getDate();
            });
        }

        function getBirthdaysByMonth() {
            const birthdays = getBirthdaysFromStars();
            const grouped = {};
            birthdays.forEach(b => {
                const month = new Date(b.date).getMonth();
                if (!grouped[month]) grouped[month] = [];
                grouped[month].push(b);
            });
            return grouped;
        }

        function getSundays(month, year) {
            const sundays = [];
            const date = new Date(year, month - 1, 1);
            while (date.getDay() !== 0) date.setDate(date.getDate() + 1);
            while (date.getMonth() === month - 1) {
                sundays.push(new Date(date));
                date.setDate(date.getDate() + 7);
            }
            return sundays;
        }

        function formatDate(date) {
            return date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        function render() {
            if (!currentUser) {
                renderLogin();
            } else {
                renderDashboard();
            }
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-red-50 to-red-100 flex items-center justify-center p-4">
                    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8 space-y-8">
                        <div class="text-center space-y-2">
                            <div class="w-12 h-12 bg-red-600 rounded-lg mx-auto flex items-center justify-center">
                                <span class="text-white text-lg font-bold">P</span>
                            </div>
                            <h1 class="text-3xl font-bold tracking-tight text-black">Plateforme de gestion</h1>
                            <p class="text-sm font-light text-gray-600">ICC Lyon Sud</p>
                        </div>
                        <div class="space-y-4">
                            <input id="email" type="email" placeholder="Email" value="admin@icc.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white text-black placeholder-gray-400 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                            <input id="password" type="password" placeholder="Mot de passe" value="admin123" class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white text-black placeholder-gray-400 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                        </div>
                        <button onclick="handleLogin()" class="w-full px-4 py-3 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg transition-colors">Connexion</button>
                        <div class="text-center space-y-2 pt-4 border-t border-gray-200">
                            <p class="text-xs font-light text-gray-600">Identifiants de test</p>
                            <p class="text-xs text-gray-700">admin@icc.com / admin123</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (email === 'admin@icc.com' && password === adminPassword) {
                currentUser = {name: 'Admin', email: email};
                activeTab = 'dashboard';
                generateMaintenanceSchedule();
                render();
            } else {
                alert('Identifiants incorrects!');
            }
        }

        function handleLogout() {
            currentUser = null;
            activeTab = 'dashboard';
            render();
        }

        function changePassword() {
            const oldPassword = prompt('Ancien mot de passe:');
            if (!oldPassword) return;
            
            if (oldPassword !== adminPassword) {
                alert('Ancien mot de passe incorrect!');
                return;
            }
            
            const newPassword = prompt('Nouveau mot de passe:');
            if (!newPassword || newPassword.length < 3) {
                alert('Le mot de passe doit faire au moins 3 caractères!');
                return;
            }
            
            adminPassword = newPassword;
            alert('Mot de passe changé avec succès!');
        }

        function switchTab(tab) {
            activeTab = tab;
            sidebarOpen = false;
            render();
        }

                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        `}
                    </div>
                `;
            }

            else if (activeTab === 'events') {
                content = `
                    <div class="space-y-8">
                        <div class="flex justify-between items-center">
                            <h1 class="text-4xl font-bold text-black">Événements</h1>
                            <button onclick="addEvent()" class="px-6 py-3 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 shadow transition-colors">+ Ajouter</button>
                        </div>
                        ${events.length === 0 ? '<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6 text-center"><p class="text-yellow-800">Aucun événement</p></div>' : `
                        <div class="space-y-4">
                            ${events.map(e => `
                                <div class="bg-white rounded-lg shadow p-6 border-l-4 border-red-600">
                                    <div class="flex justify-between items-start gap-4">
                                        <div class="flex-1">
                                            <h3 class="text-lg font-bold text-black">${e.title}</h3>
                                            <p class="text-gray-600 mt-2">${new Date(e.date).toLocaleDateString('fr-FR')} ${e.startTime ? 'à ' + e.startTime : ''}</p>
                                            ${e.location ? `<p class="text-gray-600">${e.location}</p>` : ''}
                                        </div>
                                        <button onclick="deleteEvent(${e.id})" class="text-red-600 hover:text-red-700 font-bold text-xl flex-shrink-0">✕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        `}
                    </div>
                `;
            }

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gray-50 flex">
                    <div class="${sidebarOpen ? '' : 'hidden'} md:block w-64 h-screen bg-white border-r border-gray-200 p-6 overflow-y-auto fixed md:relative z-40 shadow">
                        <div class="mb-8">
                            <h2 class="text-xl font-bold text-black">Plateforme</h2>
                            <p class="text-sm text-gray-600 mt-1">${currentUser.name}</p>
                            <button onclick="changePassword()" class="text-xs text-red-600 hover:text-red-700 mt-2 underline">Changer mot de passe</button>
                        </div>
                        <nav class="space-y-2">
                            <button onclick="switchTab('dashboard')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Tableau de bord</button>
                            <button onclick="switchTab('recap')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'recap' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Récapitulatif</button>
                            <button onclick="switchTab('planning')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'planning' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Planning</button>
                            <button onclick="switchTab('departments')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'departments' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Départements</button>
                            <button onclick="switchTab('birthdays')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'birthdays' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Anniversaires</button>
                            <button onclick="switchTab('maintenance')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'maintenance' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Entretien</button>
                            <button onclick="switchTab('events')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'events' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Événements</button>
                        </nav>
                        <button onclick="handleLogout()" class="mt-8 w-full px-4 py-3 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Déconnexion</button>
                    </div>
                    <div class="flex-1 overflow-auto">
                        <div class="md:hidden bg-white border-b border-gray-200 p-4 flex justify-between items-center shadow">
                            <h2 class="font-bold text-black">Plateforme</h2>
                            <button onclick="toggleSidebar()" class="p-2 text-red-600">☰</button>
                        </div>
                        <div class="p-6 md:p-12 max-w-7xl mx-auto">
                            ${content}
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            render();
        }

        function toggleDeptExpand(deptId) {
            expandedDepts[deptId] = !expandedDepts[deptId];
            render();
        }

        function toggleSundayExpand(dateStr) {
            expandedSundays[dateStr] = !expandedSundays[dateStr];
            render();
        }

        function toggleBirthdayMonth(monthIndex) {
            expandedBirthdayMonths[monthIndex] = !expandedBirthdayMonths[monthIndex];
            render();
        }

        function setPrevMonth() {
            selectedMonth = selectedMonth === 1 ? 12 : selectedMonth - 1;
            if (selectedMonth === 12) selectedYear--;
            render();
        }

        function setNextMonth() {
            selectedMonth = selectedMonth === 12 ? 1 : selectedMonth + 1;
            if (selectedMonth === 1) selectedYear++;
            render();
        }

        async function toggleAvailability(deptId, starId, dateStr) {
            const key = `${deptId}_${starId}_${dateStr}`;
            const newValue = !availability[key];
            availability[key] = newValue;
            localStorage.setItem('availability', JSON.stringify(availability));
            
            await supabase.from('availability').upsert({ key: key, available: newValue }, { onConflict: 'key' });
            render();
        }

        async function addDepartment() {
            const name = prompt('Nom du département:');
            if (!name) return;
            
            const newDept = { id: name.toLowerCase().replace(/\s+/g, '_'), name: name, stars: [] };
            departments.push(newDept);
            localStorage.setItem('departments', JSON.stringify(departments));
            
            await supabase.from('departments').insert(newDept);
            loadDepartments();
        }

        async function deleteDepartment(deptId) {
            if (confirm('Êtes-vous sûr?')) {
                departments = departments.filter(d => d.id !== deptId);
                localStorage.setItem('departments', JSON.stringify(departments));
                
                await supabase.from('departments').delete().eq('id', deptId);
                loadDepartments();
            }
        }

        async function addStarToDept(deptId) {
            const name = prompt('Nom de la star:');
            if (!name) return;
            const email = prompt('Email:');
            const phone = prompt('Téléphone:');
            const birthDate = prompt('Date de naissance (YYYY-MM-DD):');
            
            const dept = departments.find(d => d.id === deptId);
            if (dept) {
                const newStar = { id: Date.now(), name: name, email: email || '', phone: phone || '', birthDate: birthDate || '' };
                dept.stars.push(newStar);
                localStorage.setItem('departments', JSON.stringify(departments));
                
                await supabase.from('departments').update({ stars: dept.stars }).eq('id', deptId);
                loadDepartments();
            }
        }

        async function removeStarFromDept(deptId, starId) {
            if (confirm('Êtes-vous sûr?')) {
                const dept = departments.find(d => d.id === deptId);
                if (dept) {
                    dept.stars = dept.stars.filter(s => s.id !== starId);
                    localStorage.setItem('departments', JSON.stringify(departments));
                    
                    await supabase.from('departments').update({ stars: dept.stars }).eq('id', deptId);
                    loadDepartments();
                }
            }
        }

        async function addEvent() {
            const title = prompt('Titre:');
            if (!title) return;
            const date = prompt('Date (YYYY-MM-DD):');
            const startTime = prompt('Heure (HH:MM):');
            const location = prompt('Lieu:');
            
            const newEvent = { title: title, date: date || '', startTime: startTime || '', location: location || '' };
            events.push(newEvent);
            localStorage.setItem('events', JSON.stringify(events));
            
            await supabase.from('events').insert(newEvent);
            loadEvents();
        }

        async function deleteEvent(id) {
            if (confirm('Êtes-vous sûr?')) {
                events = events.filter(e => e.id !== id);
                localStorage.setItem('events', JSON.stringify(events));
                
                await supabase.from('events').delete().eq('id', id);
                loadEvents();
            }
        }

        function getServicesForSunday(sunday) {
            const dateStr = sunday.toISOString().split('T')[0];
            const result = {};
            departments.forEach(dept => {
                result[dept.id] = {
                    name: dept.name,
                    stars: (dept.stars || []).filter(star => availability[`${dept.id}_${star.id}_${dateStr}`] || false)
                };
            });
            return result;
        }

        initializeData();
    </script>
</body>
</html>
