<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plateforme ICC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app"></div>
    <script>
        let user = null;
        let tab = 'dashboard';
        let depts = JSON.parse(localStorage.getItem('depts') || '[]');
        let events = JSON.parse(localStorage.getItem('events') || '[]');

        function render() {
            if (!user) {
                document.getElementById('app').innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-red-50 to-red-100 flex items-center justify-center">
                        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
                            <h1 class="text-3xl font-bold text-center mb-8 text-black">Plateforme ICC</h1>
                            <input id="e" type="email" value="admin@icc.com" class="w-full p-3 border rounded mb-4 text-black" />
                            <input id="p" type="password" value="admin123" class="w-full p-3 border rounded mb-4 text-black" />
                            <button onclick="login()" class="w-full bg-red-600 text-white p-3 rounded font-bold">Connexion</button>
                        </div>
                    </div>
                `;
                return;
            }

            let content = '';
            if (tab === 'dashboard') {
                const totalStars = depts.reduce((acc, d) => acc + (d.stars ? d.stars.length : 0), 0);
                content = `
                    <h1 class="text-4xl font-bold mb-8 text-black">Tableau de bord</h1>
                    <div class="grid grid-cols-4 gap-4">
                        <div class="bg-red-600 text-white p-6 rounded"><p>Depts</p><p class="text-4xl font-bold">${depts.length}</p></div>
                        <div class="bg-red-500 text-white p-6 rounded"><p>Stars</p><p class="text-4xl font-bold">${totalStars}</p></div>
                        <div class="bg-red-400 text-white p-6 rounded"><p>Events</p><p class="text-4xl font-bold">${events.length}</p></div>
                    </div>
                `;
            }
            else if (tab === 'departments') {
                content = `
                    <h1 class="text-4xl font-bold mb-8 text-black">Départements</h1>
                    <button onclick="addDept()" class="bg-red-600 text-white px-6 py-3 rounded mb-6 font-bold">+ Ajouter</button>
                    <div class="grid grid-cols-3 gap-6">
                        ${depts.map(d => `
                            <div class="bg-white p-6 rounded shadow">
                                <h3 class="text-xl font-bold mb-4 text-black">${d.name}</h3>
                                <p class="text-3xl font-bold text-red-600 mb-4">${d.stars ? d.stars.length : 0}</p>
                                <button onclick="addStar('${d.id}')" class="w-full border-2 border-red-300 text-red-600 py-2 rounded mb-4 font-bold">+ Star</button>
                                <button onclick="delDept('${d.id}')" class="w-full bg-red-600 text-white py-2 rounded font-bold">Supprimer</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            else if (tab === 'events') {
                content = `
                    <h1 class="text-4xl font-bold mb-8 text-black">Événements</h1>
                    <button onclick="addEvent()" class="bg-red-600 text-white px-6 py-3 rounded mb-6 font-bold">+ Ajouter</button>
                    <div class="space-y-4">
                        ${events.map(e => `
                            <div class="bg-white p-6 rounded shadow border-l-4 border-red-600">
                                <h3 class="font-bold text-black">${e.title}</h3>
                                <p class="text-gray-600">${e.date}</p>
                                <button onclick="delEvent(${e.id})" class="mt-4 bg-red-600 text-white px-4 py-2 rounded font-bold">Supprimer</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            document.getElementById('app').innerHTML = `
                <div class="flex min-h-screen">
                    <div class="w-64 bg-white border-r p-6">
                        <h2 class="text-xl font-bold mb-8 text-black">Plateforme</h2>
                        <nav class="space-y-2">
                            <button onclick="changeTab('dashboard')" class="w-full text-left p-3 rounded ${tab === 'dashboard' ? 'bg-red-600 text-white' : 'hover:bg-gray-100 text-gray-700'}">Tableau</button>
                            <button onclick="changeTab('departments')" class="w-full text-left p-3 rounded ${tab === 'departments' ? 'bg-red-600 text-white' : 'hover:bg-gray-100 text-gray-700'}">Départements</button>
                            <button onclick="changeTab('events')" class="w-full text-left p-3 rounded ${tab === 'events' ? 'bg-red-600 text-white' : 'hover:bg-gray-100 text-gray-700'}">Événements</button>
                        </nav>
                        <button onclick="logout()" class="mt-8 w-full p-3 border rounded hover:bg-gray-50 text-gray-700 font-bold">Déconnexion</button>
                    </div>
                    <div class="flex-1 p-12">
                        ${content}
                    </div>
                </div>
            `;
        }

        function login() {
            if (document.getElementById('e').value === 'admin@icc.com' && document.getElementById('p').value === 'admin123') {
                user = true;
                render();
            } else {
                alert('Identifiants incorrects!');
            }
        }

        function logout() {
            user = null;
            render();
        }

        function changeTab(t) {
            tab = t;
            render();
        }

        function addDept() {
            const name = prompt('Nom du département:');
            if (name) {
                depts.push({ id: Date.now(), name: name, stars: [] });
                localStorage.setItem('depts', JSON.stringify(depts));
                render();
            }
        }

        function delDept(id) {
            if (confirm('Supprimer?')) {
                depts = depts.filter(d => d.id !== id);
                localStorage.setItem('depts', JSON.stringify(depts));
                render();
            }
        }

        function addStar(deptId) {
            const name = prompt('Nom de la star:');
            if (name) {
                const dept = depts.find(d => d.id === deptId);
                if (dept) {
                    dept.stars.push({ id: Date.now(), name: name });
                    localStorage.setItem('depts', JSON.stringify(depts));
                    render();
                }
            }
        }

        function addEvent() {
            const title = prompt('Titre:');
            if (title) {
                events.push({ id: Date.now(), title: title, date: new Date().toLocaleDateString() });
                localStorage.setItem('events', JSON.stringify(events));
                render();
            }
        }

        function delEvent(id) {
            if (confirm('Supprimer?')) {
                events = events.filter(e => e.id !== id);
                localStorage.setItem('events', JSON.stringify(events));
                render();
            }
        }

        render();
    </script>
</body>
</html>
