<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plateforme de gestion ICC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md space-y-12">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-light tracking-tight text-black">Plateforme de gestion</h1>
                <p class="text-sm font-light text-gray-500">ICC Lyon Sud</p>
            </div>
            <div class="space-y-6">
                <div class="space-y-4">
                    <input type="email" placeholder="Email" value="admin@icc.com" class="w-full px-4 py-3 border border-gray-200 bg-white text-black placeholder-gray-400 text-sm focus:outline-none focus:border-red-500" />
                    <input type="password" placeholder="Mot de passe" value="admin123" class="w-full px-4 py-3 border border-gray-200 bg-white text-black placeholder-gray-400 text-sm focus:outline-none focus:border-red-500" />
                </div>
                <button class="w-full px-4 py-3 bg-red-600 hover:bg-red-700 text-white text-sm font-medium transition-colors">Connexion</button>
            </div>
            <div class="text-center space-y-2 pt-8 border-t border-gray-200">
                <p class="text-xs font-light text-gray-500">Identifiants de test</p>
                <p class="text-xs text-gray-600">admin@icc.com / admin123</p>
            </div>
        </div>
    </div>
</body>
</html>
