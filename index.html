<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plateforme de gestion ICC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app"></div>
    <script>
        let currentUser = null;
        let activeTab = 'dashboard';
        let sidebarOpen = false;
        let expandedDepts = {};
        let expandedSundays = {};
        let expandedBirthdayMonths = {};
        let selectedMonth = 7;
        let selectedYear = 2026;

        let departments = [];
        let events = [];
        let availability = {};
        let maintenanceSchedule = {};

        const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

        // CHARGER LES DONNÉES
        function loadData() {
            try {
                const savedDepts = localStorage.getItem('departments');
                const savedEvents = localStorage.getItem('events');
                const savedAvailability = localStorage.getItem('availability');
                
                if (savedDepts) departments = JSON.parse(savedDepts);
                if (savedEvents) events = JSON.parse(savedEvents);
                if (savedAvailability) availability = JSON.parse(savedAvailability);
                
                generateMaintenanceSchedule();
            } catch (e) {
                console.error('Erreur chargement:', e);
            }
        }

        // SAUVEGARDER LES DONNÉES
        function saveData() {
            try {
                localStorage.setItem('departments', JSON.stringify(departments));
                localStorage.setItem('events', JSON.stringify(events));
                localStorage.setItem('availability', JSON.stringify(availability));
            } catch (e) {
                console.error('Erreur sauvegarde:', e);
            }
        }

        function generateMaintenanceSchedule() {
            maintenanceSchedule = {};
            if (departments.length === 0) return;

            const startMonth = 8;
            const startYear = 2026;
            const endMonth = 12;
            const endYear = 2026;

            let deptIndex = 0;
            const deptsList = departments.slice();

            for (let year = startYear; year <= endYear; year++) {
                const startM = year === startYear ? startMonth : 8;
                const endM = year === endYear ? endMonth : 12;

                for (let month = startM; month <= endM; month++) {
                    const sundays = getSundays(month, year);
                    const key = `${year}-${String(month).padStart(2, '0')}`;
                    maintenanceSchedule[key] = [];

                    sundays.forEach((sunday, index) => {
                        if (index < deptsList.length) {
                            maintenanceSchedule[key].push({
                                sunday: sunday,
                                week: index + 1,
                                dept: deptsList[(deptIndex + index) % deptsList.length]
                            });
                        }
                    });

                    deptIndex = (deptIndex + sundays.length) % deptsList.length;
                }
            }
        }

        function getAllStars() {
            const allStars = {};
            departments.forEach(dept => {
                if (dept.stars) {
                    dept.stars.forEach(star => {
                        if (!allStars[star.id]) {
                            allStars[star.id] = star;
                        }
                    });
                }
            });
            return Object.values(allStars);
        }

        function getSundays(month, year) {
            const sundays = [];
            const date = new Date(year, month - 1, 1);
            while (date.getDay() !== 0) date.setDate(date.getDate() + 1);
            while (date.getMonth() === month - 1) {
                sundays.push(new Date(date));
                date.setDate(date.getDate() + 7);
            }
            return sundays;
        }

        function formatDate(date) {
            return date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        function render() {
            try {
                if (!currentUser) {
                    renderLogin();
                } else {
                    renderDashboard();
                }
            } catch (e) {
                console.error('Erreur render:', e);
                document.getElementById('app').innerHTML = `<div class="p-8"><p class="text-red-600">Erreur: ${e.message}</p></div>`;
            }
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-red-50 to-red-100 flex items-center justify-center p-4">
                    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8 space-y-8">
                        <div class="text-center space-y-2">
                            <div class="w-12 h-12 bg-red-600 rounded-lg mx-auto flex items-center justify-center">
                                <span class="text-white text-lg font-bold">P</span>
                            </div>
                            <h1 class="text-3xl font-bold tracking-tight text-black">Plateforme de gestion</h1>
                            <p class="text-sm font-light text-gray-600">ICC Lyon Sud</p>
                        </div>
                        <div class="space-y-4">
                            <input id="email" type="email" placeholder="Email" value="admin@icc.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white text-black placeholder-gray-400 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                            <input id="password" type="password" placeholder="Mot de passe" value="admin123" class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white text-black placeholder-gray-400 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                        </div>
                        <button onclick="handleLogin()" class="w-full px-4 py-3 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg transition-colors">Connexion</button>
                        <div class="text-center space-y-2 pt-4 border-t border-gray-200">
                            <p class="text-xs font-light text-gray-600">Identifiants de test</p>
                            <p class="text-xs text-gray-700">admin@icc.com / admin123</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (email === 'admin@icc.com' && password === 'admin123') {
                currentUser = {name: 'Admin', email: email};
                activeTab = 'dashboard';
                generateMaintenanceSchedule();
                render();
            } else {
                alert('Identifiants incorrects!');
            }
        }

        function handleLogout() {
            currentUser = null;
            activeTab = 'dashboard';
            render();
        }

        function switchTab(tab) {
            activeTab = tab;
            sidebarOpen = false;
            render();
        }

        function renderDashboard() {
            const sundays = getSundays(selectedMonth, selectedYear);
            const allStars = getAllStars();
            let content = '';

            if (activeTab === 'dashboard') {
                const nextSunday = sundays[0];
                content = `
                    <div class="space-y-12">
                        <div class="space-y-2">
                            <h1 class="text-4xl font-bold text-black">Bienvenue</h1>
                            <p class="text-gray-600">Vue d'ensemble de votre plateforme</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                            <div class="bg-gradient-to-br from-red-500 to-red-600 rounded-lg p-6 text-white shadow-lg">
                                <p class="text-sm font-light opacity-90">Stars ★</p>
                                <p class="text-4xl font-bold mt-2">${allStars.length}</p>
                            </div>
                            <div class="bg-gradient-to-br from-red-400 to-red-500 rounded-lg p-6 text-white shadow-lg">
                                <p class="text-sm font-light opacity-90">Départements</p>
                                <p class="text-4xl font-bold mt-2">${departments.length}</p>
                            </div>
                            <div class="bg-gradient-to-br from-red-300 to-red-400 rounded-lg p-6 text-white shadow-lg">
                                <p class="text-sm font-light opacity-90">Événements</p>
                                <p class="text-4xl font-bold mt-2">${events.length}</p>
                            </div>
                            <div class="bg-gradient-to-br from-red-600 to-red-700 rounded-lg p-6 text-white shadow-lg">
                                <p class="text-sm font-light opacity-90">Total</p>
                                <p class="text-4xl font-bold mt-2">${allStars.length + departments.length + events.length}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            else if (activeTab === 'departments') {
                content = `
                    <div class="space-y-8">
                        <div class="flex justify-between items-center">
                            <h1 class="text-4xl font-bold text-black">Départements</h1>
                            <button onclick="addDepartment()" class="px-6 py-3 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 shadow transition-colors">+ Ajouter</button>
                        </div>
                        ${departments.length === 0 ? `
                            <div class="bg-gradient-to-br from-red-50 to-red-100 rounded-lg p-12 text-center border-2 border-dashed border-red-200">
                                <h2 class="text-2xl font-bold text-red-600 mb-2">Aucun département</h2>
                                <p class="text-gray-600 mb-6">Commencez par ajouter votre premier département</p>
                                <button onclick="addDepartment()" class="px-8 py-3 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition-colors inline-block">+ Créer le premier département</button>
                            </div>
                        ` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${departments.map(dept => {
                                return `
                                    <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow">
                                        <div class="bg-gradient-to-r from-red-500 to-red-600 px-6 py-4">
                                            <div class="flex justify-between items-start">
                                                <h2 class="text-xl font-bold text-white">${dept.name}</h2>
                                                <button onclick="deleteDepartment('${dept.id}')" class="text-white hover:bg-red-700 rounded-full w-8 h-8 flex items-center justify-center">✕</button>
                                            </div>
                                        </div>
                                        <div class="p-6 space-y-4">
                                            <div class="bg-red-50 rounded-lg p-4">
                                                <p class="text-sm text-gray-600">Stars</p>
                                                <p class="text-3xl font-bold text-red-600">${dept.stars ? dept.stars.length : 0}</p>
                                            </div>
                                            <button onclick="addStarToDept('${dept.id}')" class="w-full py-3 border-2 border-dashed border-red-300 text-red-600 font-bold rounded-lg hover:bg-red-50 transition-colors">+ Ajouter star ★</button>
                                            ${dept.stars && dept.stars.length > 0 ? `
                                                <div class="space-y-2 max-h-48 overflow-y-auto">
                                                    ${dept.stars.map(star => `
                                                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-start gap-2">
                                                            <div class="flex-1 min-w-0">
                                                                <p class="font-medium text-black text-sm">${star.name}</p>
                                                                <p class="text-xs text-gray-600 truncate">${star.email}</p>
                                                                <p class="text-xs text-gray-600">${star.phone}</p>
                                                            </div>
                                                            <button onclick="removeStarFromDept('${dept.id}', ${star.id})" class="text-red-600 hover:text-red-700 font-bold flex-shrink-0">✕</button>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        `}
                    </div>
                `;
            }

            else if (activeTab === 'events') {
                content = `
                    <div class="space-y-8">
                        <div class="flex justify-between items-center">
                            <h1 class="text-4xl font-bold text-black">Événements</h1>
                            <button onclick="addEvent()" class="px-6 py-3 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 shadow transition-colors">+ Ajouter</button>
                        </div>
                        ${events.length === 0 ? '<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6 text-center"><p class="text-yellow-800">Aucun événement</p></div>' : `
                        <div class="space-y-4">
                            ${events.map(e => `
                                <div class="bg-white rounded-lg shadow p-6 border-l-4 border-red-600">
                                    <div class="flex justify-between items-start gap-4">
                                        <div class="flex-1">
                                            <h3 class="text-lg font-bold text-black">${e.title}</h3>
                                            <p class="text-gray-600 mt-2">${new Date(e.date).toLocaleDateString('fr-FR')} ${e.startTime ? 'à ' + e.startTime : ''}</p>
                                            ${e.location ? `<p class="text-gray-600">${e.location}</p>` : ''}
                                        </div>
                                        <button onclick="deleteEvent(${e.id})" class="text-red-600 hover:text-red-700 font-bold text-xl flex-shrink-0">✕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        `}
                    </div>
                `;
            }

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gray-50 flex">
                    <div class="${sidebarOpen ? '' : 'hidden'} md:block w-64 h-screen bg-white border-r border-gray-200 p-6 overflow-y-auto fixed md:relative z-40 shadow">
                        <div class="mb-8">
                            <h2 class="text-xl font-bold text-black">Plateforme</h2>
                            <p class="text-sm text-gray-600 mt-1">${currentUser.name}</p>
                        </div>
                        <nav class="space-y-2">
                            <button onclick="switchTab('dashboard')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Tableau de bord</button>
                            <button onclick="switchTab('departments')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'departments' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Départements</button>
                            <button onclick="switchTab('events')" class="w-full text-left px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'events' ? 'bg-red-600 text-white' : 'text-gray-700 hover:bg-gray-100'}">Événements</button>
                        </nav>
                        <button onclick="handleLogout()" class="mt-8 w-full px-4 py-3 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Déconnexion</button>
                    </div>
                    <div class="flex-1 overflow-auto">
                        <div class="md:hidden bg-white border-b border-gray-200 p-4 flex justify-between items-center shadow">
                            <h2 class="font-bold text-black">Plateforme</h2>
                            <button onclick="toggleSidebar()" class="p-2 text-red-600">☰</button>
                        </div>
                        <div class="p-6 md:p-12 max-w-7xl mx-auto">
                            ${content}
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            render();
        }

        function addDepartment() {
            const name = prompt('Nom du département:');
            if (!name) return;
            departments.push({id: name.toLowerCase().replace(/\s+/g, '_'), name: name, stars: []});
            generateMaintenanceSchedule();
            saveData();
            render();
        }

        function deleteDepartment(deptId) {
            if (confirm('Êtes-vous sûr?')) {
                departments = departments.filter(d => d.id !== deptId);
                generateMaintenanceSchedule();
                saveData();
                render();
            }
        }

        function addStarToDept(deptId) {
            const name = prompt('Nom de la star:');
            if (!name) return;
            const email = prompt('Email:');
            const phone = prompt('Téléphone:');
            
            const dept = departments.find(d => d.id === deptId);
            if (dept) {
                dept.stars.push({
                    id: Date.now(),
                    name: name,
                    email: email || '',
                    phone: phone || ''
                });
                saveData();
                render();
            }
        }

        function removeStarFromDept(deptId, starId) {
            if (confirm('Êtes-vous sûr?')) {
                const dept = departments.find(d => d.id === deptId);
                if (dept) {
                    dept.stars = dept.stars.filter(s => s.id !== starId);
                    saveData();
                    render();
                }
            }
        }

        function addEvent() {
            const title = prompt('Titre:');
            if (!title) return;
            const date = prompt('Date (YYYY-MM-DD):');
            const startTime = prompt('Heure (HH:MM):');
            const location = prompt('Lieu:');
            events.push({
                id: Date.now(),
                title: title,
                date: date || '',
                startTime: startTime || '',
                location: location || ''
            });
            saveData();
            render();
        }

        function deleteEvent(id) {
            if (confirm('Êtes-vous sûr?')) {
                events = events.filter(e => e.id !== id);
                saveData();
                render();
            }
        }

        // Au démarrage
        loadData();
        render();
    </script>
</body>
</html>
